[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts", "conftest"]

[tool.ruff.lint.per-file-ignores]
# %-formatting keeps the LaTeX braces readable in the listings map.
"docs/latex/make_listings_map.py" = ["UP031"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependencies are declared as argument defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
