# Render Blueprint: New > Blueprint > pick this repository.
# One process runs the three modules (SERVICE_MODE=single): model API at /, database API under /db,
# web dashboard at /. The committed artifact is served as-is (no training at build time), so the
# numbers in the report, the slides and the live API are the same model. PYTHON_VERSION and
# requirements.txt are pinned to the environment that trained artifacts/breast_cancer_svm.joblib.
# The free plan has no persistent disk: SQLite is recreated at every start and seed.py puts the
# demo and admin accounts, the WDBC table and the first model comparison back.
services:
  - type: web
    name: breast-cancer-svm-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SERVICE_MODE
        value: single
      # Signing key for the login tokens, generated once by Render; never committed.
      - key: JWT_SECRET
        generateValue: true
      # Password of the "admin" account, the only one allowed on the "Dữ liệu SQL" page
      # (Render generates it; read it in the service's Environment tab).
      - key: ADMIN_PASSWORD
        generateValue: true
